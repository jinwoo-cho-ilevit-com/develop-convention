# Local hooks can be skipped — and on a machine with a global `core.hooksPath`,
# `pre-commit install` refuses outright — so CI is where these actually run
# (→ conventions/03-environment.md, 13-secret-management.md).
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # tests/test_release.py reads back to the commit that last set the plugin
          # version. The default depth of 1 makes that check skip.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Lint and format
        run: |
          uv run --group dev ruff check .
          uv run --group dev ruff format --check .

      # tests/test_plugin.py::test_the_cli_accepts_the_manifests skips without this binary,
      # pinned to the version the test was verified against
      # (https://code.claude.com/docs/en/setup.md).
      - name: Install the Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.267
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The repository invariants under tests/ stand in for the checklist in CLAUDE.md,
      # and drive the plugin's guard and workflow rather than reading them.
      - name: Test
        run: uv run --group dev pytest

      # pre-commit installs its remote hooks into ~/.cache/pre-commit, building gitleaks from
      # Go source. setup-uv's cache does not cover that directory, so without this it is
      # rebuilt on every run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit hooks
        run: uvx pre-commit run --all-files
