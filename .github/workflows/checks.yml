name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  toolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `contract.py red` needs history to reach the base commit

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint and format
        run: |
          uv run --group dev ruff check .
          uv run --group dev ruff format --check .

      - name: Test
        run: uv run --group dev pytest

      - name: Secret scan
        run: uvx pre-commit run gitleaks --all-files

  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every convention doc opens with Core Rules
        run: |
          fail=0
          for f in conventions/*.md; do
            first=$(grep -m1 '^## ' "$f")
            if [ "$first" != "## Core Rules" ]; then
              echo "FAIL $f -> first heading is '$first'"
              fail=1
            fi
          done
          exit $fail

      - name: No tool-call residue
        run: |
          if grep -rn '</content>\|</invoke>\|</antml' conventions/ templates/ README.md CLAUDE.md; then
            echo "FAIL tool-call residue committed"
            exit 1
          fi

      - name: Doc map links resolve
        run: |
          fail=0
          for p in $(grep -oE '\(conventions/[0-9]{2}-[a-z-]+\.md\)' README.md | tr -d '()' | sort -u); do
            [ -f "$p" ] || { echo "FAIL missing $p"; fail=1; }
          done
          exit $fail
