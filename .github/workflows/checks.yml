# Local hooks can be skipped — and on a machine with a global `core.hooksPath`,
# `pre-commit install` refuses outright — so CI is where these actually run
# (→ conventions/03-environment.md, 13-secret-management.md).
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # `contract.py red` checks out the contract's base commit

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Lint and format
        run: |
          uv run --group dev ruff check .
          uv run --group dev ruff format --check .

      # Covers both testpaths: the contract toolkit under templates/scripts/, and the
      # repository invariants under tests/ that stand in for the checklist in CLAUDE.md.
      - name: Test
        run: uv run --group dev pytest

      - name: Secret scan
        run: uvx pre-commit run gitleaks --all-files
