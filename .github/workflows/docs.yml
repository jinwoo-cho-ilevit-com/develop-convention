name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble docs dir
        run: |
          mkdir -p docs
          cp README.md docs/index.md
          cp -r conventions docs/conventions
          cp -r templates docs/templates
          cp -r skills docs/skills

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Build site
        run: uv run --group docs mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
