site_name: Development Conventions
site_url: https://jinwoo-cho-ilevit-com.github.io/develop-convention/
repo_url: https://github.com/jinwoo-cho-ilevit-com/develop-convention

# docs/ is assembled at build time (README.md → docs/index.md; conventions/ and templates/ copied in).
# Local preview: run the assemble step from .github/workflows/docs.yml, then `uvx --with mkdocs-material mkdocs serve`
docs_dir: docs

# MkDocs 1.6 excludes /templates/ at the docs root by default; re-include via negation pattern
exclude_docs: |
  !/templates/

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - tables
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Conventions:
      - conventions/00-principles.md
      - conventions/01-structure-naming.md
      - conventions/02-config.md
      - conventions/03-environment.md
      - conventions/04-pipeline.md
      - conventions/05-performance.md
      - conventions/06-testing-verification.md
      - conventions/07-ml-development.md
      - conventions/08-llm-development.md
      - conventions/09-agentic-workflow.md
      - conventions/10-llm-api-inference.md
      - conventions/11-llm-api-providers.md
      - conventions/12-upstream-docs.md
      - conventions/13-secret-management.md
      - conventions/14-context-management.md
      - conventions/15-doc-tracking.md
      - conventions/16-research-protocol.md
      - conventions/17-commit-protocol.md
      - conventions/18-work-contract.md
      - conventions/19-evidence.md
      - conventions/20-review-gate.md
      - conventions/21-development-loop.md
      - conventions/22-framework-wrapping.md
      - conventions/23-remote-gpu-iteration.md
  - Harness:
      - skills/plan-and-delegate/SKILL.md
      - skills/code-and-config/SKILL.md
      - skills/commit/SKILL.md
      - skills/verify-and-review/SKILL.md
      - skills/ml-pipeline/SKILL.md
      - skills/external-sources/SKILL.md
      - skills/docsync/SKILL.md
      - templates/AGENTS.md
  - Decisions:
      - adr/0001-contract-runner.md
      - adr/0002-invariants-as-tests.md
      - adr/0003-deliberate-omissions.md
      - adr/0004-retiring-the-contract-runner.md
