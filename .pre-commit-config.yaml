# Local hooks can be skipped, so CI runs the same set (→ conventions/03, 13).
repos:
  # ruff runs from the dev dependency group, so pyproject.toml holds the only pin in this
  # repository. A `rev` here would be a second version, and two of them format differently.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --group dev ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --group dev ruff format --force-exclude
        language: system
        types_or: [python, pyi]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
