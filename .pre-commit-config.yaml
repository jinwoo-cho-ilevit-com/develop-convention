# CI runs every hook here with `pre-commit run --all-files` (→ conventions/03, 13).
repos:
  # ruff runs from the dev dependency group, so pyproject.toml holds the only pin in this
  # repository. A `rev` here would be a second version, and two of them format differently.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --group dev ruff check --force-exclude --fix
        language: system
        files: \.pyi?$
      - id: ruff-format
        name: ruff format
        entry: uv run --group dev ruff format --force-exclude
        language: system
        files: \.pyi?$

      # The documents check each other, so one edited file is not a scope: the run reads the
      # whole tree and takes no file arguments.
      - id: check-docs
        name: document invariants
        entry: uv run --group dev python scripts/check-docs.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
