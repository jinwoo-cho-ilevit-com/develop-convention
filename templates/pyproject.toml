[project]
name = "PROJECT_NAME"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest",
  # Pinned to the rev of the ruff-pre-commit hook in .pre-commit-config.yaml: pre-commit
  # installs its own copy, and two versions format differently, so the hook rewrites what
  # the local check just called clean.
  "ruff==0.14.5",
  "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "--strict-markers"

# --- ML (PyTorch) projects only: uncomment (conventions/03-environment.md §2) ---
