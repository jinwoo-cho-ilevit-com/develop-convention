# What this runner treats as a secret when masking evidence (C-15).
#
# Deliberately over-broad: a false mask costs a reader one lookup, a missed one
# leaks a credential. Every shape carries a `sample`; the test suite asserts that
# each pattern matches its own sample and that no shape lacks one, so a pattern
# added here without a planted credential fails the suite rather than sitting
# untested.
#
# A `sample` is a list of fragments, joined only in memory. Written whole, it is a
# credential in exactly the format scanners are built to find — GitHub's push
# protection rejected a push over the Slack sample below, and every project that
# copied this toolkit inherited the same block. Split any sample you add, and put
# the split inside the body rather than at a delimiter; the test suite refuses a
# sample that appears whole on any line of this file.
#
# `env_names` are fnmatch globs against variable *names*. The value of a matching
# variable is redacted as a literal wherever it appears, which catches credentials
# that match no shape at all.

env_names = [
  "*_TOKEN",
  "*_SECRET",
  "*_SECRET_*",
  "*_KEY",
  "*_PASSWORD",
  "*_PASSWD",
  "*_CREDENTIALS",
  "*_PRIVATE_KEY",
  "AWS_SESSION_TOKEN",
  "GITHUB_TOKEN",
]

[[shape]]
name = "aws-access-key-id"
pattern = '\bA(?:KIA|SIA|IDA|ROA)[0-9A-Z]{16}\b'
sample = ["AKIAIOSFO", "DNN7EXAMPLE"]

[[shape]]
name = "github-pat-classic"
pattern = '\bghp_[A-Za-z0-9]{36}\b'
sample = ["ghp_ABCDEFGHIJKLMN", "OPQRSTUVWXYZ0123456789"]

[[shape]]
name = "github-pat-fine-grained"
pattern = '\bgithub_pat_[A-Za-z0-9_]{22,}\b'
sample = ["github_pat_11ABCDEFG0abcdefghij", "_KLMNOPQRSTUVWXYZ0123456789abcdefghijklmno"]

[[shape]]
name = "slack-token"
pattern = '\bxox[abposr]-[A-Za-z0-9-]{10,}\b'
sample = ["xoxb-123456789012", "-1234567890123-abcdefghijklmnopqrstuvwx"]

[[shape]]
name = "openai-key"
pattern = '\bsk-[A-Za-z0-9_-]{20,}\b'
sample = ["sk-proj-abcdefghijklm", "nopqrstuvwxyz0123456789ABCD"]

[[shape]]
name = "bearer-header"
pattern = '(?i)\bbearer\s+[A-Za-z0-9._~+/-]{16,}=*'
sample = ["Bearer eyJhbGciOiJIUzI1NiIsInR5", "cCI6IkpXVCJ9.abcdefghij"]

[[shape]]
name = "assigned-credential"
pattern = '(?i)\b(?:api[_-]?key|secret|token|password|passwd)\s*[=:]\s*["\x27]?[A-Za-z0-9._~+/-]{8,}'
sample = ["api_key=supersec", "retvalue123"]

[[shape]]
name = "private-key-header"
pattern = '-----BEGIN (?:RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----'
sample = ["-----BEGIN OPENSSH ", "PRIVATE KEY-----"]
